const grid = document.getElementById("grid");

items.forEach((item) => {
  const card = document.createElement("div");
  card.className = "card";

  const title = document.createElement("h3");
  const link = document.createElement("a");
  link.href = "https://ordinals.com/inscription/" + item.id;
  link.target = "_blank";
  link.rel = "noreferrer";
  link.textContent = "Yue Minjun — " + item.name;
  title.appendChild(link);
  card.appendChild(title);

  const stage = document.createElement("div");
  stage.className = "stage";
  item.layers.forEach((layer) => {
    const img = document.createElement("img");
    img.src = layer.src;
    img.alt = layer.kind;
    img.loading = "lazy";
    if (layer.tint) img.classList.add("tint");
    img.onerror = () => { img.style.outline = "1px solid #f66"; };
    stage.appendChild(img);
  });
  card.appendChild(stage);

  const traits = document.createElement("div");
  traits.className = "traits";
  traits.innerHTML = Object.entries(item.meta)
    .map(([k, v]) => `<div><b>${k}:</b> ${v}</div>`)
    .join("");
  card.appendChild(traits);

  grid.appendChild(card);
});
